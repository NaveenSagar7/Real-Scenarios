apiVersion: v1
kind: Service
metadata:
  name: {{ include "meter-reading-service.fullname" . }}
  labels:
    {{- include "meter-reading-service.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    app: meter-reading-service
    tier: backend
