apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "meter-reading-service.fullname" . }}
  labels:
    {{- include "meter-reading-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "meter-reading-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "meter-reading-service.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
        - name: meter-reading-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: METER_BUCKET
              value: {{ .Values.env.meterBucket | quote }}
            - name: METER_TABLE
              value: {{ .Values.env.meterTable | quote }}
            - name: AWS_REGION
              value: {{ .Values.env.awsRegion | quote }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
