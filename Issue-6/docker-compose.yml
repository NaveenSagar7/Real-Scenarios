version: "3.8"

services:
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "999"   # docker group on most hosts — adjust if your `docker.sock` group differs
    user: root  # simplest way to let the Jenkins container use the mounted docker.sock in this lab

volumes:
  jenkins_home:
