# Applying this policy makes it the sole source of truth for traffic to/from
# every pod in myapp: anything not explicitly allowed below is denied.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: daily-journal-netpol
  namespace: myapp
spec:
  podSelector:
    matchLabels:
      app: daily-journal
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # LAB ONLY: no ALB in the kodekloud lab, so traffic arrives via NodePort
    # from outside the cluster instead of from ENIs on the VPC CIDR. Opened
    # wide on port 8080 for testing. On live EKS, replace this ipBlock back
    # with the VPC CIDR (the ALB, target-type: ip, sends traffic from its
    # ENIs in the VPC's public subnets directly to pod IPs).
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Postgres in myapp-db
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: myapp-db
          podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
