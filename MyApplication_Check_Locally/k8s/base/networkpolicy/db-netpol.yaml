# Applying this policy makes it the sole source of truth for traffic to/from
# every pod in myapp-db: anything not explicitly allowed below is denied -
# in particular, only daily-journal pods in one of the three app namespaces
# may reach Postgres. One shared Postgres serves all three environments, so
# all three app namespaces need to be listed here explicitly.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-netpol
  namespace: myapp-db
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: myapp-dev
          podSelector:
            matchLabels:
              app: daily-journal
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: myapp-qa
          podSelector:
            matchLabels:
              app: daily-journal
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: myapp-prod
          podSelector:
            matchLabels:
              app: daily-journal
      ports:
        - protocol: TCP
          port: 5432
    # Prometheus (monitoring ns) scraping the postgres-exporter sidecar.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9187
  egress:
    # DNS only
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
