# CHANGE THESE before applying, and don't commit real values to git.
# Prefer creating this imperatively instead, e.g.:
#   kubectl create secret generic postgres-credentials -n myapp-db \
#     --from-literal=POSTGRES_DB=dailyjournal \
#     --from-literal=POSTGRES_USER=journal_app \
#     --from-literal=POSTGRES_PASSWORD='<strong-random-password>'
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: myapp-db
type: Opaque
stringData:
  POSTGRES_DB: dailyjournal
  POSTGRES_USER: journal_app
  POSTGRES_PASSWORD: CHANGE_ME_STRONG_PASSWORD
