# CHANGE THESE before applying, and don't commit real values to git.
# Prefer creating this imperatively instead, e.g. (swap -n for whichever
# environment you're creating it in: myapp-dev, myapp-qa, or myapp-prod):
#   kubectl create secret generic app-secrets -n myapp-dev \
#     --from-literal=SPRING_DATASOURCE_USERNAME=journal_app \
#     --from-literal=SPRING_DATASOURCE_PASSWORD='<same-password-as-postgres-credentials>' \
#     --from-literal=APP_PAN_SECRET="$(openssl rand -hex 32)"
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: myapp-dev
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: journal_app
  SPRING_DATASOURCE_PASSWORD: CHANGE_ME_STRONG_PASSWORD
  APP_PAN_SECRET: CHANGE_ME_RANDOM_32_BYTE_HEX_KEY
