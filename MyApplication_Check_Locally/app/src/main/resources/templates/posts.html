<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Daily Journal - My Posts</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
  <div class="banner">
    <h1>Your entries</h1>
    <p th:text="${user.name}">there</p>
  </div>
  <div class="container">
    <a class="link-back" th:href="@{/dashboard}">&larr; back to dashboard</a>
    <div class="card">
      <h2>Previous posts</h2>
      <p class="muted" th:if="${#lists.isEmpty(posts)}">No entries yet - go add your first one!</p>
      <div th:each="post : ${posts}" class="post-item">
        <div class="post-date" th:text="${#temporals.format(post.createdAt, 'dd MMM yyyy, HH:mm')}">date</div>
        <div th:text="${post.content}">content</div>
      </div>
    </div>
  </div>
</body>
</html>
