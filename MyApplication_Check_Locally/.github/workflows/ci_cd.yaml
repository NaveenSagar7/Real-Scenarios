#github ci_cd.yaml for this repository

name: CI/CD Pipeline for Development environment
on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop


#jobs -> build, lint, test using sonarqube, build image , test images using trivy, push to ecr, deploy to development eks cluster

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
        
      - name: Build with Maven
        working-directory: app
        run: mvn clean install
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
        
      - name: Lint with Maven
        working-directory: app
        run: mvn checkstyle:check
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: SonarQube analysis
        working-directory: app
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B verify sonar:sonar
          -Dsonar.host.url=$SONAR_HOST_URL
          -Dsonar.token=$SONAR_TOKEN
          -Dsonar.qualitygate.wait=true
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    # id-token: write is required so GitHub can issue the OIDC token that
    # configure-aws-credentials exchanges for temporary AWS credentials -
    # without this permission the OIDC assume-role step fails outright.
    permissions:
      id-token: write
      contents: read
    #needs: [sonarqube]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: set up docker
        uses: docker/setup-buildx-action@v2

      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Logs Docker in to ECR using the temporary OIDC-assumed credentials,
      # and exposes the account's registry URL as an output so we don't
      # have to hardcode the AWS account id anywhere in this file.
      - name: login to ecr
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # Tags images with the short commit SHA (same 7-char hash GitHub
      # shows next to each commit) instead of :latest, so every image is
      # traceable back to the exact commit it was built from.
      - name: short sha
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      # Builds and loads the image into the local Docker daemon only
      # (push: false, load: true) so Trivy can scan it before anything
      # gets pushed to ECR.
      - name: build docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: ${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ env.SHORT_SHA }}

      # Scans the freshly built image for known CVEs. exit-code: '1' fails
      # this step (and stops the job, so the push below never runs) if any
      # CRITICAL or HIGH severity vulnerability is found.
      - name: trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ env.SHORT_SHA }}
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: push docker image
        run: docker push ${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ env.SHORT_SHA }}
  
  
  deploy-eks:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: [build-and-push]
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: update kubeconfig
        run: aws eks update-kubeconfig --name ${{ vars.EKS_CLUSTER_NAME }} --region ${{ vars.AWS_REGION }}
      
      - name: login to ecr
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # Alternative to the step above, if you'd rather skip the unneeded
      # docker login this job never actually uses: ask STS for the account
      # id directly and build the registry URL by hand instead.
      # - name: get aws account id
      #   id: aws-account
      #   run: echo "id=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_OUTPUT"
      # then reference it in set image tag below as:
      #   ${{ steps.aws-account.outputs.id }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ vars.ECR_REPOSITORY }}:${{ env.SHORT_SHA }}

      - name: short sha
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      # rewrites only the images: entry inside kustomization.yaml,
      # never touches deployment.yaml itself
      - name: set image tag
        working-directory: k8s
        run: kustomize edit set image REPLACE_WITH_ECR_REPOSITORY_URL=${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ env.SHORT_SHA }}

      - name: deploy to eks
        run: kubectl apply -k k8s/

      - name: verify rollout
        run: kubectl rollout status deployment/daily-journal -n myapp --timeout=120s