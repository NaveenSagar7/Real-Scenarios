apiVersion: apps/v1
kind: Deployment
metadata:
  name: daily-journal
  namespace: myapp
  labels:
    app: daily-journal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: daily-journal
  template:
    metadata:
      labels:
        app: daily-journal
    spec:
      serviceAccountName: daily-journal
      containers:
        - name: daily-journal
          # Replace with the ecr_repository_url Terraform output, e.g.
          # 593241949985.dkr.ecr.ap-south-1.amazonaws.com/myapp:latest
          image: REPLACE_WITH_ECR_REPOSITORY_URL:latest
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
